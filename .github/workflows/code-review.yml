name: Code Review

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test:
    # if: ${{ contains(github.event.*.labels.*.name, 'gpt review') }} # Optional; to run only when a label is attached
    runs-on: ubuntu-latest
    steps:
      - uses: anc95/ChatGPT-CodeReview@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.AI_API_KEY }}
          # Optional
          LANGUAGE: Russian
          OPENAI_API_ENDPOINT: https://integrate.api.nvidia.com/v1
          MODEL: deepseek-ai/deepseek-r1 # https://platform.openai.com/docs/models
          PROMPT: |
            Запрос на код-ревью. Пожалуйста, помоги выявить:
            * Любые логические ошибки, баги или упущения.
            * Неоптимальные участки кода или потенциальные проблемы с производительностью.
            * Уязвимости безопасности.
            * Отклонения от стандартов кодирования или лучших практик.
            * Места, которые могут быть сложны для понимания или поддержки.
          top_p: 1 # https://platform.openai.com/docs/api-reference/chat/create#chat/create-top_p
          temperature: 1 # https://platform.openai.com/docs/api-reference/chat/create#chat/create-temperature
          max_tokens: 10000
          MAX_PATCH_LENGTH: 10000 # if the patch/diff length is large than MAX_PATCH_LENGTH, will be ignored and won't review. By default, with no MAX_PATCH_LENGTH set, there is also no limit for the patch/diff length.
          IGNORE_PATTERNS: /depedencies/*,*.md # glob pattern or regex pattern to ignore files, separated by comma
          INCLUDE_PATTERNS: Qurre.slnx,*.cs,*.cs*,*.slnx # glob pattern or regex pattern to include files, separated by comma
